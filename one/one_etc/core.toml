[server_workers]
operating = 2
ugc = 2
query = 2
monitor = 2

[celery_workers]
routine = 16

[database.postgres.primary]  # 数据库配置
db = 'mars_db'
user = 'root'
password = 'root'
host = '127.0.0.1'
port = 5432
charset = 'utf8'
pool_size = 20
[database.postgres.secondary]
db = 'mars_db'
user = 'root'
password = 'root'
host = '127.0.0.1'
port = 5432
charset = 'utf8'
pool_size = 20
[database.redis]
host = '127.0.0.1'
port = 6379
db = 0
password = 'root'

[parliament]
senator_list = ['scheduler', 'launcher', 'server', 'k8swatcher']
validate_attr = 'archive_unique_sign'
mass_set = 'mass_set'
info_channel = 'info_channel'
monitor_count = 'monitor_count'
backend = 'redis'

[launcher]
api_server = 'http://127.0.0.1'
manager_nodes = ["jd-a1006-dl","jd-a1007-dl","jd-a1008-dl","jd-a1101-dl"]
image_pull_policy = 'IfNotPresent'
manager_image = 'registry.cn-hangzhou.aliyuncs.com/opendeepinfra/hai-platform:latest'
# Namespaces the k8s watcher observes, keyed by user role. k8s_watcher.py uses:
#     namespaces        = list(CONF.launcher.task_namespaces_by_role.values())
#     default_namespace = CONF.launcher.task_namespaces_by_role['internal']
# With the previous placeholder ('poly-hpp') the watcher observed a namespace
# that does not exist in a standard deployment, so it registered no nodes at all
# and leader election failed with `namespaces "poly-hpp" not found`.
[launcher.task_namespaces_by_role]
internal = 'hai-platform'
external = 'hai-platform'
[launcher.manager_envs]
# KEY = VALUE
[launcher.manager_mounts]
# read_only_mount_name = "host_path:mount_path:ro"
# writable_mount_name = "host_path:mount_path"

[manager]  # 这里有两个与部署有关的配置，一个是任务启动的 namespace，一个是 manager 放在哪些节点上
delete_pod.grace_period_seconds = 0
redis_message_channel = 'DEV_manager_channel'
stop_channel = 'DEV_manager_stop_channel'
update_status_channel = 'DEV_manager_update_status_channel'
node_memory_leak_channel = 'DEV_whistle_node_memory_leak_channel'
suspend_waiting_seconds.final = 5
suspend_waiting_seconds.recieved = 5
unschedulable_timeout_Ms = 1
not_stop_node_for_test = 0
image_pull_policy = 'IfNotPresent'

[k8s]
[[k8s.config]]
config_file = '' # empty means in-cluster config

[k8swatcher]
configmap_lock = 'one-k8swatcher-leader-lock'

[experiment.log]
number_of_files = 4
max_filesize = '2M'
max_ops = '50k'
max_line_length = 4096
[[experiment.log.dist]]
role = 'internal'
dir = '/nfs_shared/workspace/log/{user_name}'

[user_data_roaming]
patch_ttl = 0.3
sync_interval = 1.0
sync_throttling_time = 0.1
max_num_throttling = 5
message_queue_channel = "user_data_mq_channel"

# hai-cli workspace 工作区同步（设计 §9.1）
# provider 可选：oss（阿里云，走 STS）/ s3（RustFS、MinIO 等 S3 兼容）/ localfs（本地目录，测试用）
[cloud.storage]
provider = 's3'
endpoint = 'http://127.0.0.1:19000'
access_key_id = 'CHANGE_ME'
access_key_secret = 'CHANGE_ME'
uid = ''
role_arn = 'hai-platform'
private_bucket = 'hai-platform-private'
public_bucket = 'hai-platform-public'
doc_bucket = 'hai-platform-private'
pypi_bucket = 'hai-platform-private'
official_website_bucket = 'hai-platform-private'

[cloud.storage.service]
# 工作区在集群共享盘上的根目录
workspace_path = '/nfs_shared/workspace'
env_path = '/hf_shared'
public_dataset_path = '/nfs_shared/public_dataset'
private_dataset_path = '/nfs_shared/private_dataset'
doc_path = '/nfs_shared/doc'
pypi_path = '/nfs_shared/pypi'
official_website_path = '/nfs_shared/website'
breakpoint_info_path = '/var/lib/hai/cloud_storage/breakpoints'
proxy_endpoint = ''
public_bucket_allowed_users = ''
password = ''
# 灰度开关（OPS-01）
enabled = true
enabled_users = []
enabled_groups = []
# 老客户端兼容层（FR-14）
legacy_param_compat = true
# 终态 TTL 必须 >= 客户端 --sync_timeout 默认值 1800（ADR-6）
status_ttl_finished = 1800
max_files_per_request = 10000
max_bytes_per_request = 1099511627776
max_page_size = 1000
# 崩溃恢复（FR-13 / ADR-5）
recover_on_startup = true
recover_stale_seconds = 600
workers = 4
